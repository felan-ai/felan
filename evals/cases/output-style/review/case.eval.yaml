id: output-style-review
suite: output-style
description: Compare review summaries for the same merge-readiness finding.
workspace:
  fixture: fixtures/output-style/v1/source
agents:
  include:
    - felan-no-output-style
    - felan-concise
    - felan-explanatory
    - felan-caveman
prompt: |
  Review `src/calculator.js` for merge readiness. Do not change any files.
assert:
  - id: outcome-retained
    type: contains
    value: "not implemented"
  - id: verification-retained
    type: contains
    value: "src/calculator.js"
  - id: function-retained
    type: contains
    value: "add"
  - id: no-files-edited
    type: workspaceDiff
    changedFiles: []
  - id: semantic-quality
    type: jevJudge
    required: false
    threshold: 0.8
    judge:
      rubric: >-
        Is the final response a correct and concise merge-readiness review of
        src/calculator.js? It must accurately identify that add is not
        implemented, name the relevant file and function, and avoid inventing
        tests, changes, or verification. Do not reward unsupported claims or
        penalize concise wording.
      inputs: [finalOutput, assertions]
