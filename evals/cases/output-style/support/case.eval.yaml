id: output-style-support
suite: output-style
description: Compare how response styles answer the same open-ended benchmark question.
workspace:
  fixture: fixtures/output-style/v1/source
agents:
  include:
    - felan-no-output-style
    - felan-concise
    - felan-explanatory
    - felan-caveman
prompt: |
  A teammate is considering using this benchmark and asks, "What does it
  actually tell us?" Review the workspace and answer their question. Do not
  change any files.
assert:
  - id: outcome-retained
    type: contains
    value: "response"
  - id: style-retained
    type: contains
    value: "style"
  - id: no-files-edited
    type: workspaceDiff
    changedFiles: []
  - id: semantic-quality
    type: jevJudge
    required: false
    threshold: 0.8
    judge:
      rubric: >-
        Is the final response a correct and concise explanation of what this
        benchmark tells us? It should explain that the benchmark compares agent
        response style while preserving task correctness and required content,
        without inventing results or unsupported claims. Do not reward
        unsupported claims or penalize concise wording.
      inputs: [finalOutput, assertions]
