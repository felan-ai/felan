id: subagents-classifier-verification
suite: subagents-routing
description: Route a neutral coding task to an implementation agent and an independent reviewer.
timeoutMs: 900000
workspace:
  fixture: fixtures/subagent-routing/v1/source
agents:
  include:
    - felan-grok-static
    - felan-grok-classified
prompt: >-
  Fix the retry scheduling implementation so the tests pass. Then report the
  resulting retry delays for four attempts with a base delay of 100 and a
  maximum delay of 250. Do not change the tests.
assert:
  - id: implementation-agent-used
    type: toolCalled
    name: Agent
    min: 1
    max: 1
    argsContain:
      - '"subagent_type":"general"'
    isError: false
    when:
      agent: felan-grok-classified
  - id: reviewer-agent-used
    type: toolCalled
    name: Agent
    min: 1
    max: 1
    argsContain:
      - '"subagent_type":"reviewer"'
    isError: false
    when:
      agent: felan-grok-classified
  - id: solved-task
    type: contains
    value: "100, 200, 250, 250"
verifier:
  command: node
  args: [--test]
  timeoutMs: 120000
  network:
    mode: none
