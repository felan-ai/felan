id: subagents-async-completion
suite: subagents
description: Surface a completed background subagent result in the parent response.
timeoutMs: 300000
workspace:
  fixture: fixtures/felan-adapter-smoke/v1/source
agents:
  include:
    - felan-delegated-exploration
prompt: >-
  Use the Agent tool exactly once with subagent_type general. Ask the helper to
  execute `printf ASYNC_SUBAGENT_RESULT_7C91` and report the exact marker. When
  the asynchronous completion result is available, tell me the marker verbatim.
  Do not edit files.
assert:
  - id: one-asynchronous-child
    type: toolCalled
    name: Agent
    min: 1
    max: 1
    isError: false
    argsContain:
      - 'general'
  - id: completion-marker-relayed
    type: contains
    value: ASYNC_SUBAGENT_RESULT_7C91
  - id: no-files-edited
    type: workspaceDiff
    changedFiles: []
