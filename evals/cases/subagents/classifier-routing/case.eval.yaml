id: subagents-classifier-routing
suite: subagents-routing
description: Keep a neutral multi-file investigation in the parent without user-requested delegation.
timeoutMs: 900000
workspace:
  fixture: fixtures/subagent-routing/v1/source
agents:
  include:
    - felan-grok-static
    - felan-grok-classified
prompt: >-
  Trace the batch-receiving path across the source files and report one concise
  line containing the maximum batch size, the selected queue for an urgent
  item, and the retry delay. Do not edit files.
assert:
  - id: no-unrequested-child
    type: toolCalled
    name: Agent
    min: 0
    max: 0
  - id: solved-task
    type: contains
    value: "17"
  - id: solved-task-queue
    type: contains
    value: "priority"
  - id: solved-task-delay
    type: contains
    value: "240"
  - id: no-files-edited
    type: workspaceDiff
    changedFiles: []
