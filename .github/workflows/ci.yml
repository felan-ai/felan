name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test daemon
            run: pnpm --filter @felan-ai/daemon test
          - name: test felan
            run: pnpm --filter @felan-ai/felan test
          - name: test ext-memory
            run: pnpm --filter @felan-ai/ext-memory test
          - name: test packages
            run: pnpm -r --filter '!@felan-ai/daemon' --filter '!@felan-ai/felan' --filter '!@felan-ai/ext-memory' --if-present test
          # Build compiles every workspace with the same sources and options as type-check.
          - name: packed install
            run: pnpm check:licenses && pnpm pack:all && pnpm test:packed-bin
          - name: release versions
            run: pnpm check:proposed-version
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: pnpm build
      - run: ${{ matrix.run }}

  # Branch protection requires a single check named verify.
  verify:
    if: always()
    needs: check
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.check.result }}" = success
