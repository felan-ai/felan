name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: ${{ matrix.name }}${{ matrix.os != 'ubuntu-latest' && format(' ({0})', matrix.os) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'ubuntu-latest' && 30 || 60 }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          # Each job runs the root Vitest config so its projects share one worker pool.
          # The github-actions reporter turns each failed test into a check-run annotation, which
          # the Felan GitHub App can read without job logs. test-isolated.sh drops GITHUB_ACTIONS,
          # so Vitest would not add it by itself.
          - name: test daemon
            os: ubuntu-latest
            run: pnpm test -- --project @felan-ai/daemon --reporter=default --reporter=github-actions
          - name: test felan
            os: ubuntu-latest
            run: pnpm test -- --project @felan-ai/felan --reporter=default --reporter=github-actions
          - name: test packages
            os: ubuntu-latest
            run: pnpm test -- --project '@felan-ai/ext-*' --project @felan-ai/agent-core --project @felan-ai/session-protocol --reporter=default --reporter=github-actions
          # Build compiles every workspace with the same sources and options as type-check.
          - name: packed install
            os: ubuntu-latest
            run: pnpm check:licenses && pnpm pack:all && pnpm test:packed-bin && pnpm test:dist
          - name: release versions
            os: ubuntu-latest
            run: pnpm check:proposed-version
          # Windows runners stall for seconds at random, so any test can pass Vitest's 5 s
          # default. Only the CLI flag reaches projects without their own Vitest config.
          - name: test daemon
            os: windows-latest
            run: scripts/test-isolated.sh pnpm test -- --project @felan-ai/daemon --testTimeout=30000 --reporter=default --reporter=github-actions
          - name: test felan
            os: windows-latest
            run: scripts/test-isolated.sh pnpm test -- --project @felan-ai/felan --testTimeout=30000 --reporter=default --reporter=github-actions
          - name: test packages
            os: windows-latest
            run: scripts/test-isolated.sh pnpm test -- --project '@felan-ai/ext-*' --project @felan-ai/agent-core --project @felan-ai/session-protocol --testTimeout=30000 --reporter=default --reporter=github-actions
          - name: packed install
            os: windows-latest
            run: scripts/test-isolated.sh bash -c 'pnpm check:licenses && pnpm pack:all && pnpm test:packed-bin && pnpm test:dist'
          - name: test daemon
            os: windows-11-arm
            run: scripts/test-isolated.sh pnpm test -- --project @felan-ai/daemon --testTimeout=30000 --reporter=default --reporter=github-actions
    steps:
      - uses: actions/checkout@v4
        # Git Bash scripts and the shrinkwrap parser require LF before any run step.
        env:
          GIT_CONFIG_COUNT: ${{ runner.os == 'Windows' && '1' || '0' }}
          GIT_CONFIG_KEY_0: core.autocrlf
          GIT_CONFIG_VALUE_0: 'false'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
      - name: Configure Windows script shell
        if: runner.os == 'Windows'
        run: pnpm config set script-shell 'C:\Program Files\Git\bin\bash.exe' --location project
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
        if: runner.os == 'Linux'
      - name: Install Windows ripgrep
        if: runner.os == 'Windows'
        run: choco install ripgrep --no-progress -y && rg --version
      - run: pnpm dead-code
        if: matrix.name == 'packed install'
      - run: pnpm build
      # The daemon refuses a packaged host.json that an account other than the owner can
      # write, because that file names the providers it loads. A production install owns it
      # under the npm prefix, while a hosted runner's checkout can inherit a permissive ACE
      # from the drive, which fails on some runners and not others. The build copies the file
      # into dist, where the copy inherits that directory's ACL, so this runs after the build.
      - name: Restrict the packaged host.json ACL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $account = [Security.Principal.WindowsIdentity]::GetCurrent().Name
          foreach ($file in 'apps\felan\src\host.json', 'apps\felan\dist\host.json') {
            icacls $file /inheritance:r /grant:r "${account}:(R,W)"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            icacls $file
          }
      - run: ${{ matrix.run }}

  # Branch protection requires a single check named verify.
  verify:
    if: always()
    needs: check
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.check.result }}" = success
