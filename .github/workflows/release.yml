name: Release packages

on:
  push:
    branches:
      - main

concurrency:
  group: release-packages
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - name: Select unpublished package versions
        id: release
        run: pnpm select:release-packages
      - if: steps.release.outputs.has_packages == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.release.outputs.has_packages == 'true'
        run: pnpm verify
      - if: steps.release.outputs.has_packages == 'true'
        run: npm install --global npm@11.19.0
      - name: Record stable packed audit
        if: steps.release.outputs.has_packages == 'true' && steps.release.outputs.has_stable == 'true'
        continue-on-error: true
        run: pnpm audit:packed
      - name: Publish package versions
        if: steps.release.outputs.has_packages == 'true'
        env:
          PACKAGE_PATHS: ${{ steps.release.outputs.package_paths }}
        run: |
          set -euo pipefail
          for package_path in $PACKAGE_PATHS
          do
            package_name="$(node -p "require('./${package_path}/package.json').name")"
            version="$(node -p "require('./${package_path}/package.json').version")"
            artifact="${package_name#@}"
            artifact=".artifacts/${artifact/\//-}-${version}.tgz"
            channel=latest
            if [[ "$version" == *-* ]]; then
              channel=next
            fi
            npm publish "$artifact" --access public --tag "$channel" --provenance
          done
