name: Release packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm check:proposed-version
      - run: npm install --global npm@11.19.0
      - name: Verify release identity
        id: release
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          test "${GITHUB_REF_NAME#v}" = "$version"
          git fetch origin main
          git merge-base --is-ancestor "$(git rev-parse "$GITHUB_SHA^{commit}")" origin/main
          if [[ "$version" == *-* ]]; then
            echo 'channel=next' >> "$GITHUB_OUTPUT"
            echo 'stable=false' >> "$GITHUB_OUTPUT"
          else
            echo 'channel=latest' >> "$GITHUB_OUTPUT"
            echo 'stable=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Record stable packed audit
        if: steps.release.outputs.stable == 'true'
        continue-on-error: true
        run: pnpm audit:packed
      - run: |
          version="$(node -p 'require("./package.json").version')"
          for package in \
            ".artifacts/felan-ai-agent-core-${version}.tgz" \
            ".artifacts/felan-ai-ext-subagents-${version}.tgz" \
            ".artifacts/felan-ai-ext-context-${version}.tgz" \
            ".artifacts/felan-ai-ext-prewalk-${version}.tgz" \
            ".artifacts/felan-ai-ext-powerline-${version}.tgz" \
            ".artifacts/felan-ai-felan-${version}.tgz"
          do
            npm publish "$package" --access public --tag "${{ steps.release.outputs.channel }}" --provenance
          done
