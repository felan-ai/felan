name: Windows probe

# Temporary platform probe for the native Windows daemon work. Delete before merge.
on:
  push:
    branches: [feat/windows-daemon]
    paths: [scripts/windows-probe.mjs, .github/workflows/windows-probe.yml]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - run: pnpm install --frozen-lockfile --filter @felan-ai/daemon...
        shell: bash
      - run: node scripts/windows-probe.mjs
        shell: bash
